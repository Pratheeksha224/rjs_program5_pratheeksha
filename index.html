
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
            text-align: center;
            width: 300px;
        }

        h1 {
            color: #3730a3;
            font-size: 25px;
        }

        .result {
            background: #e0e7ff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Temperature Converter</h1>
        <p>Celsius to Fahrenheit</p>

        <div id="output"></div>
    </div>

    <script>
        const celsius = [0, 20, 30, 40];

        const fahrenheit = celsius.map(
            c => (c * 9 / 5) + 32
        );

        const output = document.getElementById("output");

        celsius.forEach((c, i) => {
            const result = document.createElement("div");
            result.className = "result";
            result.textContent =
                c + "°C = " + fahrenheit[i] + "°F";
            output.appendChild(result);
        });
    </script>
</body>
</html>
